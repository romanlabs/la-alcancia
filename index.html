<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>La Alcancía</title>
  <meta name="description" content="Cuánto apartar cada día para que no falte el día de pagar.">
  <meta name="theme-color" content="#1f6f4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="stylesheet" href="estilos.css?v=23">
</head>
<body>
  <!-- Íconos de La Alcancía: línea redondeada + relleno suave del mismo color (funciona en claro y oscuro) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
    <defs>
      <style>.r{fill:currentColor;opacity:.16;stroke:none}.p{fill:currentColor;stroke:none}</style>
    </defs>
    <!-- Hoy: calendario con sol -->
    <symbol id="i-hoy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M6 5h12a2.5 2.5 0 0 1 2.5 2.5v2h-17v-2A2.5 2.5 0 0 1 6 5z"/>
      <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
      <path d="M3.5 9.5h17M8 3v4M16 3v4"/>
      <circle cx="12" cy="15" r="2.1"/>
      <path d="M12 11.4v.7M12 17.9v.7M8.4 15h.7M14.9 15h.7M9.5 12.5l.5.5M14 17l.5.5M9.5 17.5l.5-.5M14 13l.5-.5"/>
    </g></symbol>
    <!-- Pagos: recibo con borde cortado y moneda -->
    <symbol id="i-pagos" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/>
      <path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/>
      <path d="M9 7.8h6M9 11h6M9 14.3h3"/>
      <circle cx="15.2" cy="14.6" r="1.5"/>
    </g></symbol>
    <!-- Ahorro: alcancía con moneda entrando -->
    <symbol id="i-ahorro" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M5 12c0-3.4 3.1-5.8 7.2-5.8 1.4 0 2.6.3 3.7.7l2.4-1.5-.4 3c1 .8 1.6 1.8 1.9 3H21v3.2h-1.9a6 6 0 0 1-2.4 2.6V20h-2.6v-1.6c-.7.1-1.5.2-2.3.2s-1.5-.1-2.2-.2V20H7.3v-2.3A5.6 5.6 0 0 1 5 13.4z"/>
      <path d="M5 12c0-3.4 3.1-5.8 7.2-5.8 1.4 0 2.6.3 3.7.7l2.4-1.5-.4 3c1 .8 1.6 1.8 1.9 3H21v3.2h-1.9a6 6 0 0 1-2.4 2.6V20h-2.6v-1.6c-.7.1-1.5.2-2.3.2s-1.5-.1-2.2-.2V20H7.3v-2.3A5.6 5.6 0 0 1 5 13.4z"/>
      <path d="M5 12.6c-1.2-.1-2-.9-2-2M10.2 8.3h3.3"/>
      <circle class="p" cx="16.6" cy="10.9" r=".75"/>
      <circle cx="11.8" cy="3.4" r="1.6"/>
    </g></symbol>
    <!-- Historial: reloj con flecha hacia atrás -->
    <symbol id="i-historial" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle class="r" cx="12.4" cy="12" r="8.2"/>
      <path d="M4.2 12a8.2 8.2 0 1 0 2.4-5.8"/>
      <path d="M3.8 4.1v3.8h3.8"/>
      <path d="M12.4 7.6V12l2.9 1.9"/>
    </g></symbol>
    <!-- Ajustes: controles deslizantes -->
    <symbol id="i-ajustes" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.5h8.5M17.5 6.5H20M4 12h2.5M11.5 12H20M4 17.5h10.5M19.5 17.5h.5"/>
      <circle class="r" cx="15" cy="6.5" r="2.4"/><circle cx="15" cy="6.5" r="2.4"/>
      <circle class="r" cx="9" cy="12" r="2.4"/><circle cx="9" cy="12" r="2.4"/>
      <circle class="r" cx="17" cy="17.5" r="2.4"/><circle cx="17" cy="17.5" r="2.4"/>
    </g></symbol>
    <!-- Tarjeta de crédito con chip -->
    <symbol id="i-tarjeta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect class="r" x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
      <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
      <path d="M2.5 9.6h19" stroke-width="2.2"/>
      <rect x="5.5" y="12.4" width="3.8" height="2.9" rx=".7"/>
      <path d="M13 12.8h3M13 15.3h5.5"/>
    </g></symbol>
    <!-- Valor variable: aproximado (dos ondas) -->
    <symbol id="i-variable" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 9.8c2-2.3 3.8-2.3 5.7 0s3.7 2.3 5.6 0 3.7-2.3 5.7 0"/>
      <path d="M3.5 15.2c2-2.3 3.8-2.3 5.7 0s3.7 2.3 5.6 0 3.7-2.3 5.7 0"/>
    </g></symbol>
    <!-- Nota: hoja con esquina doblada y lápiz -->
    <symbol id="i-nota" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M5.5 3.5h8.5l3.5 3.5v6l-5.5 5.5-1 2.5H5.5z"/>
      <path d="M17.5 10V7L14 3.5H5.5v17h4.5"/>
      <path d="M14 3.5V7h3.5M8.5 10h6M8.5 13.3h3.5"/>
      <path d="M19.4 12.6l1.5 1.5-5.6 5.6-2.1.6.6-2.1z"/>
    </g></symbol>
    <!-- Candado -->
    <symbol id="i-candado" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect class="r" x="4.8" y="10.4" width="14.4" height="10.1" rx="2.5"/>
      <rect x="4.8" y="10.4" width="14.4" height="10.1" rx="2.5"/>
      <path d="M8 10.4V7.8a4 4 0 0 1 8 0v2.6"/>
      <circle cx="12" cy="14.6" r="1.3"/><path d="M12 15.9v1.8"/>
    </g></symbol>
    <!-- Nube guardada (con visto) -->
    <symbol id="i-nube" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M7 18.5h10.3a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8 1.4A3.1 3.1 0 0 0 7 18.5z"/>
      <path d="M7 18.5h10.3a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8 1.4A3.1 3.1 0 0 0 7 18.5z"/>
      <path d="M9.6 14.4l1.8 1.8 3.4-3.6"/>
    </g></symbol>
    <!-- Nube sin conexión (con signo de alerta) -->
    <symbol id="i-nube-error" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M7 18.5h10.3a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8 1.4A3.1 3.1 0 0 0 7 18.5z"/>
      <path d="M7 18.5h10.3a3.8 3.8 0 0 0 .4-7.6 5.6 5.6 0 0 0-10.8 1.4A3.1 3.1 0 0 0 7 18.5z"/>
      <path d="M12 11.6v2.7"/><circle class="p" cx="12" cy="16.3" r=".8"/>
    </g></symbol>
    <!-- Listo (círculo con visto) -->
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle class="r" cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="8.6"/>
      <path d="M8.2 12.3l2.6 2.6 5-5.3"/>
    </g></symbol>
    <!-- Alerta -->
    <symbol id="i-alerta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M10.3 4.6a2 2 0 0 1 3.4 0l7.1 12.4a2 2 0 0 1-1.7 3H4.9a2 2 0 0 1-1.7-3z"/>
      <path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.1 12.4a2 2 0 0 1-1.7 3H4.9a2 2 0 0 1-1.7-3z"/>
      <path d="M12 9.6v4.2"/><circle class="p" cx="12" cy="16.6" r=".85"/>
    </g></symbol>
    <!-- Trofeo (meta cumplida / terminadas) -->
    <symbol id="i-trofeo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M7.5 4h9v4.6a4.5 4.5 0 0 1-9 0z"/>
      <path d="M7.5 4h9v4.6a4.5 4.5 0 0 1-9 0z"/>
      <path d="M7.5 5.6H5.2a2.4 2.4 0 0 0 2.7 3.6M16.5 5.6h2.3a2.4 2.4 0 0 1-2.7 3.6"/>
      <path d="M12 13.1v3.2M9.8 16.3h4.4l.6 3.7H9.2z"/>
      <path d="M12 6.3l.6 1.2 1.3.2-1 .9.3 1.3-1.2-.7-1.2.7.3-1.3-1-.9 1.3-.2z" class="p"/>
    </g></symbol>
    <!-- Mover plata a una cajita -->
    <symbol id="i-mover" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path class="r" d="M4 15.5h16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
      <path d="M4 13.5v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>
      <path d="M12 3.5v9.8M8.3 9.6l3.7 3.7 3.7-3.7"/>
    </g></symbol>
    <!-- Monedas (ahorro de una meta) -->
    <symbol id="i-monedas" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse class="r" cx="12" cy="6.8" rx="7" ry="2.6"/>
      <ellipse cx="12" cy="6.8" rx="7" ry="2.6"/>
      <path d="M5 6.8v4.6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6.8"/>
      <path d="M5 11.4V16c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4.6"/>
      <path d="M9 9.2v4.6M15 9.2v4.6" opacity=".45"/>
    </g></symbol>
    <!-- Cerrar / quitar -->
    <symbol id="i-cerrar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
    </g></symbol>
  </svg>
  <header class="barra">
    <h1>La Alcancía</h1>
    <span class="derecha-barra"><span id="fecha-hoy"></span><span id="nube-estado" class="nube"></span></span>
  </header>
  <div id="perfiles" class="perfiles"></div>

  <main id="contenido"></main>

  <nav class="pestanas" id="pestanas" hidden>
    <button data-vista="hoy"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-hoy"></use></svg><span class="txt">Hoy</span></button>
    <button data-vista="sobres"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-pagos"></use></svg><span class="txt">Pagos</span></button>
    <button data-vista="ahorro"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-ahorro"></use></svg><span class="txt">Ahorro</span></button>
    <button data-vista="historial"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-historial"></use></svg><span class="txt">Historial</span></button>
    <button data-vista="ajustes"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-ajustes"></use></svg><span class="txt">Ajustes</span></button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <dialog id="confirmar" class="confirmar"><form method="dialog">
    <p id="confirmar-texto"></p>
    <div class="botones acciones"><button value="no">Cancelar</button><button value="si" id="confirmar-si" class="principal peligro-fuerte">Sí</button></div>
  </form></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="logica.js?v=23"></script>
  <script src="nube.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
