<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>La Alcancía</title>
  <meta name="description" content="Cuánto apartar cada día para que no falte el día de pagar.">
  <meta name="theme-color" content="#1f6f4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="stylesheet" href="estilos.css?v=16">
</head>
<body>
  <header class="barra">
    <h1>La Alcancía</h1>
    <span class="derecha-barra"><span id="fecha-hoy"></span><span id="nube-estado" class="nube"></span></span>
  </header>
  <div id="perfiles" class="perfiles"></div>

  <main id="contenido"></main>

  <nav class="pestanas" id="pestanas" hidden>
    <button data-vista="hoy">Hoy</button>
    <button data-vista="sobres">Pagos</button>
    <button data-vista="ahorro">Ahorro</button>
    <button data-vista="historial">Historial</button>
    <button data-vista="ajustes">Ajustes</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <dialog id="confirmar" class="confirmar"><form method="dialog">
    <p id="confirmar-texto"></p>
    <div class="botones acciones"><button value="no">Cancelar</button><button value="si" id="confirmar-si" class="principal peligro-fuerte">Sí</button></div>
  </form></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="logica.js?v=16"></script>
  <script src="nube.js?v=16"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
